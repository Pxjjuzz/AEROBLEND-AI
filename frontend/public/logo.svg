<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="aiBlend" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Stylized atmospheric cloud + blending wave node -->
  <g transform="translate(6, 4)">
    <circle cx="16" cy="18" r="10" fill="url(#cloudGrad)" opacity="0.9" />
    <circle cx="24" cy="14" r="8" fill="url(#aiBlend)" opacity="0.85" />
    <path d="M10 24C10 20 13 18 16 18C17 14 20 12 24 12C28 12 31 15 31 19C34 19 36 21 36 24C36 26.5 34 28 31 28H14C11.5 28 10 26.5 10 24Z" fill="url(#cloudGrad)"/>
    <!-- Neural blending node wave -->
    <path d="M14 22C18 19 22 25 26 21C28 19 31 21 33 20" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
    <circle cx="26" cy="21" r="1.8" fill="#FFFFFF"/>
  </g>
  <text x="48" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="19" fill="#0F172A" letter-spacing="-0.5px">AeroBlend<tspan fill="#2563EB" font-weight="600"> AI</tspan></text>
</svg>